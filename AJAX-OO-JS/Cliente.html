<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function Cliente(id, nome, s, d) {
        this.nome = nome;
        this.id = id;

        //private
        let senha = s;
        let dataNasc = d;
        const agora = new Date(Date.now());

        this.getSenha = function () {
          return senha;
        };
        function contemMaiusculaEMinuscula(senha) {
          const temMaiuscula = /[A-Z]/.test(senha);
          const temMinuscula = /[a-z]/.test(senha);
          return temMaiuscula && temMinuscula;
        }
        this.setSenha = function (senha) {
          if (contemMaiusculaEMinuscula() == true) {
            this.senha = senha;
          }
        };
        this.getdataNasc = function () {
          return dataNasc;
        };

        this.setdataNasc = function (dataNasc) {
          if (calculadaIdade(dataNasc) >= 0) {
            this.dataNasc = dataNasc;
          }
        };
        this.getTempoCadastro = function () {
          return calculaTempoCadastro(this.agora);
        };

        this.calculaIdade = function () {
          return calculaIdade(dataNasc);
        };
      }
      function calculaTempoCadastro(agora) {
        const tempoAtual = new Date(Date.now());
        const tempoCadastro = tempoAtual - agora;
        return tempoCadastro;
      }
      function calculaIdade(dataNasc) {
        const partes = dataNasc.split("/");
        const ultimo = partes.at(-1);
        const ano = new Date().getFullYear();
        const idade = ano - ultimo;
        return idade;
      }
    </script>
  </body>
</html>
